<!DOCTYPE html>

<body>
    <h1>Nigel's Kodi Repository</h1>
    <p>To install this repository in Kodi:</p>
    <ol>
        <li>Go to <strong>Settings &rarr; File Manager &rarr; Add Source</strong>.</li>
        <li>Enter URL: <code>https://nigel1992.github.io/kodi-repository/</code></li>
        <li>Go to <strong>Settings &rarr; Add-ons &rarr; Install from zip file</strong> and select the source.</li>
    </ol>
</body>
