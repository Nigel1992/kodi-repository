name: Update Repository

on:
  push:
    paths:
      - "repository.nigel1992/**"
      - "scripts/sync_releases.py"
      - "addon-sources.json"
      - "tests/**"
      - ".github/workflows/update_repo.yml"

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kodi-repository
  cancel-in-progress: false

jobs:
  update-repo:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show Python version
        run: python --version

      - name: Test release validation
        run: python -m unittest discover -s tests -v

      - name: Sync stable addon releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_releases.py

      - name: Generate repository files
        working-directory: repository.nigel1992
        run: python generate_repo.py

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -f repository.nigel1992/

          if git diff --staged --quiet; then
            echo "No repository changes detected."
            exit 0
          fi

          git commit -m "Auto-update addon repository"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
